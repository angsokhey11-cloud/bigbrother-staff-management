<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Staff Management Supabase</title>
<style>html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:Arial,sans-serif}.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center}.bb-card{background:#fff;border:1px solid #d9e2ef;border-radius:14px;padding:22px 28px;box-shadow:0 8px 30px #173a6615;color:#17457a;font-weight:800}.bb-sub{margin-top:6px;color:#6b7280;font-size:12px;font-weight:600}</style>
</head>
<body>
<div class="bb-loader"><div class="bb-card">Loading BIG BROTHER Staff Management…<div class="bb-sub">Admin-only Supabase database</div></div></div>
<script>
(async function(){
  try{
    const response=await fetch('legacy-google-v1.html?v=20260910-1',{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load Staff Management source.');
    let html=await response.text();

    const adapter='<scr'+'ipt src="supabase-staff-adapter.js?v=20260910-1"></scr'+'ipt>';
    const headClose=html.toLowerCase().indexOf('</head>');
    if(headClose<0)throw new Error('Staff Management source is missing </head>.');
    html=html.slice(0,headClose)+adapter+'\n'+html.slice(headClose);

    html=html.replace(
      'function apiReady(){return STAFF_DATABASE_API_URL.startsWith("https://script.google.com/");}',
      'function apiReady(){return true;}'
    );

    const marker='document.getElementById("staffStart").value=today();document.getElementById("salFrom").value=today();calcSalary();loadAll();';
    const replacement=`// SUPABASE CUTOVER\nget = window.BBStaffAdapter.get;\npost = window.BBStaffAdapter.post;\n${marker}`;
    if(!html.includes(marker))throw new Error('Staff Management initialization marker was not found.');
    html=html.replace(marker,replacement);

    html=html.replace('<title>BIG BROTHER — Staff Management</title>','<title>BIG BROTHER — Staff Management Supabase</title>');
    html=html.replace('Staff Management','Staff Management · Supabase');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="bb-loader"><div class="bb-card">Could not open Staff Management<div class="bb-sub">'+String(error?.message||error)+'</div></div></div>';
  }
})();
</script>
</body>
</html>
